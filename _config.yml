# Hexo Configuration
url: https://www.hehehey.top/
root: /
permalink: posts/:slug/
title: G/ren的小破站
language: zh-CN
theme: butterfly

author: G/ren
subtitle: 兴趣使然的小破站
description: 机器视觉 | 编程 | 技术分享

keywords: 机器视觉,Vision Master,Mech-Vision,视觉定位,海康,Hexo博客,技术分享,编程

index_generator:
  per_page: 10

deploy:
  type: git
  repository: git@github.com:Gren23/Gren23.github.io.git
  branch: master

archive_generator: ~

skip_render:
  - supertool/*.html

robotstxt:
  useragent: '*'
  allow:
  - /

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: '...'
  order_by: -date
  autodiscovery: true
  template:

sitemap:
  path: sitemap.xml
  template:
  rel: true
  tags: true
  categories: true
