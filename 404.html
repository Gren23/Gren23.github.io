
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面走丢了</title>
  <style>
    :root {
      --site-bg: #f5f5f5;
      --card-bg: rgba(255, 255, 255, 0.6);
      --text-color: #2d2d2d;
      --sub-text: #666;
      --accent: #1677B3;
      --accent2: #49b1f5;
      --glass-bg: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.7);
      --shadow: 0 8px 32px rgba(22, 119, 179, 0.12);
      --shadow-hover: 0 12px 40px rgba(22, 119, 179, 0.22);
    }
    [data-theme="dark"] {
      --site-bg: #1a1a2e;
      --card-bg: rgba(30, 30, 50, 0.55);
      --text-color: #e0e0e0;
      --sub-text: #888;
      --glass-bg: rgba(40, 40, 70, 0.5);
      --glass-border: rgba(100, 100, 180, 0.25);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --shadow-hover: 0 12px 40px rgba(22, 119, 179, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      background: var(--site-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: var(--text-color);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 15% 25%, rgba(22, 119, 179, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, rgba(240, 147, 251, 0.1) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(100, 200, 220, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; text-align: center; max-width: 500px; width: 100%; }
    .bento-404 {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
    .bento-404:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
    .deco-row { display: flex; justify-content: center; gap: 0.6rem; margin-bottom: 2rem; }
    .deco-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); opacity: 0.7; }
    .deco-dot:nth-child(2) { background: var(--accent2); width: 8px; height: 8px; }
    .deco-dot:nth-child(3) { background: ##49b1f5; width: 12px; height: 12px; }
    .deco-dot:nth-child(4) { background: var(--accent2); width: 8px; height: 8px; }
    .deco-dot:nth-child(5) { background: var(--accent); opacity: 0.7; }
    .number-404 {
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .title { font-size: 1.3rem; font-weight: 600; color: var(--text-color); margin-bottom: 0.6rem; letter-spacing: 0.05em; }
    .desc { font-size: 0.95rem; color: var(--sub-text); line-height: 1.7; margin-bottom: 2.2rem; }
    .divider { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 2rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--glass-border), transparent); }
    .divider-icon { font-size: 0.7rem; color: var(--sub-text); opacity: 0.6; }
    .btn-home {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; text-decoration: none; border-radius: 50px;
      font-size: 0.95rem; font-weight: 600; letter-spacing: 0.05em;
      box-shadow: 0 4px 16px rgba(22, 119, 179, 0.3);
      transition: all 0.25s ease;
    }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(22, 119, 179, 0.4); }
    .btn-home:active { transform: translateY(0); }
    .btn-group { display: flex; justify-content: center; gap: 0.8rem; margin-top: 1rem; flex-wrap: wrap; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      background: var(--card-bg); border: 1px solid var(--glass-border);
      color: var(--sub-text); text-decoration: none; border-radius: 50px;
      font-size: 0.85rem; backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .energy-bar { display: flex; justify-content: center; gap: 3px; margin-top: 2.5rem; }
    .energy-bar span { width: 4px; border-radius: 2px; background: linear-gradient(180deg, var(--accent), var(--accent2)); opacity: 0.4; }
    .energy-bar span:nth-child(1) { height: 8px; }
    .energy-bar span:nth-child(2) { height: 14px; }
    .energy-bar span:nth-child(3) { height: 20px; }
    .energy-bar span:nth-child(4) { height: 14px; }
    .energy-bar span:nth-child(5) { height: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="bento-404">
      <div class="deco-row">
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
      </div>
      <div class="number-404">404</div>
      <div class="title">页面走丢了 😢</div>
      <p class="desc">哎呀，这个页面不存在了。<br>可能被吃掉了，或者从来没存在过。</p>
      <div class="divider"><span class="divider-icon">✦</span></div>
      <a href="/" class="btn-home"><span>🏠</span> 返回首页</a>
      <div class="btn-group">
        <a href="/tags/" class="btn-secondary">🏷️ 标签</a>
        <a href="/categories/" class="btn-secondary">📂 分类</a>
        <a href="/message/" class="btn-secondary">✉️ 信箱</a>
      </div>
      <div class="energy-bar"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>
</body>
</html>
