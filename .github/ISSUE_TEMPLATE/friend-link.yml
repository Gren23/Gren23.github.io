name: 友链申请
description: 申请与本站交换友链
title: "【友链申请】"
labels: ["friend-link"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你愿意和本站交换友链。

        提交前请先确认：
        - 站点可正常访问，已稳定运行 3 个月以上
        - 内容以原创技术 / 生活记录为主，无违规内容
        - **已在你的站点添加本站友链**

        ---

        **本站信息（可直接复制）**

        | 项 | 内容 |
        |---|---|
        | 名称 | G/ren的小破站 |
        | 地址 | https://www.hehehey.top/ |
        | 图标 | https://www.hehehey.top/img/头像.JPG |
        | 描述 | 机器视觉调试工程师 \| 技术分享 |

  - type: input
    id: site_name
    attributes:
      label: 网站名称
      placeholder: 你的博客名
    validations:
      required: true

  - type: input
    id: site_url
    attributes:
      label: 网站地址
      placeholder: https://your-blog.com
    validations:
      required: true

  - type: input
    id: site_avatar
    attributes:
      label: 头像 URL
      placeholder: https://your-blog.com/avatar.png
      description: 留空则显示名称首字母
    validations:
      required: false

  - type: textarea
    id: site_desc
    attributes:
      label: 网站描述
      placeholder: 一句话介绍你的站点（10-60 字）
      rows: 2
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已在站点添加本站友链
          required: true
        - label: 我的站点可正常访问且内容合规
          required: true
